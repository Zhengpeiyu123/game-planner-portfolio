<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>偷土豆的人 - 限时寻物玩法</title>
  <style>
    :root {
      --coal: #090a0a;
      --ink: #11130f;
      --panel: rgba(18, 20, 17, 0.84);
      --panel-strong: rgba(12, 14, 12, 0.94);
      --line: rgba(238, 228, 199, 0.22);
      --paper: #f4ead2;
      --muted: #c5b99c;
      --gold: #d8a947;
      --ember: #b8562e;
      --frost: #9eb6bb;
      --green: #7e9565;
      --shadow: rgba(0, 0, 0, 0.55);
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Microsoft YaHei", serif;
    }

    * {
      box-sizing: border-box;
      cursor: url("../../assets/ui-v2/paintbrush-cursor.png") 3 60, auto !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--coal);
      color: var(--paper);
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      background:
        radial-gradient(circle at 18% 18%, rgba(216, 169, 71, 0.1), transparent 28%),
        linear-gradient(180deg, #141612 0%, #070808 100%);
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .screen.is-active {
      display: flex;
    }

    .start-screen {
      background:
        linear-gradient(90deg, rgba(7, 8, 8, 0.92), rgba(7, 8, 8, 0.46), rgba(7, 8, 8, 0.82)),
        url("bg-neighbor.jpeg") center / cover no-repeat;
    }

    .start-screen::after,
    .play-screen::after,
    .story-screen::after,
    .ending-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 28%, rgba(0, 0, 0, 0.52)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 4px);
      mix-blend-mode: soft-light;
    }

    .start-card {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100vw - 40px));
      margin-right: min(34vw, 420px);
      padding: 34px;
      border-left: 1px solid rgba(244, 234, 210, 0.36);
      background: linear-gradient(90deg, rgba(9, 10, 10, 0.76), rgba(9, 10, 10, 0.28));
      box-shadow: 0 26px 80px var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--frost);
      font-size: 14px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 88px);
      line-height: 0.98;
      letter-spacing: 0;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    .start-copy {
      max-width: 560px;
      margin: 22px 0 26px;
      color: #e0d3b4;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.75;
    }

    .primary-button,
    .ghost-button,
    .small-button {
      border: 1px solid rgba(244, 234, 210, 0.26);
      border-radius: 6px;
      color: var(--paper);
      background: rgba(20, 22, 18, 0.84);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .primary-button {
      min-width: 168px;
      padding: 13px 22px;
      background: linear-gradient(180deg, #a64225, #7c2e1d);
      border-color: rgba(255, 224, 160, 0.42);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
      font-weight: 700;
    }

    .ghost-button,
    .small-button {
      padding: 10px 14px;
    }

    .small-button {
      padding: 8px 11px;
      font-size: 14px;
    }

    .primary-button:hover,
    .ghost-button:hover,
    .small-button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 226, 170, 0.66);
    }

    .primary-button:disabled,
    .ghost-button:disabled,
    .small-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
    }

    .intro-screen,
    .truth-screen {
      background: #000;
    }

    .intro-video,
    .choice-video,
    .truth-video,
    .scene-video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }

    .choice-video {
      object-fit: contain;
    }

    .choice-options {
      position: absolute;
      left: 50%;
      bottom: clamp(28px, 7vh, 72px);
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 14px;
      width: min(900px, calc(100vw - 36px));
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .choice-options.is-hidden {
      display: none;
    }

    .choice-button {
      min-width: min(260px, 28vw);
      padding: 14px 22px;
      border: 1px solid rgba(244, 234, 210, 0.26);
      border-radius: 8px;
      background: rgba(14, 16, 14, 0.56);
      color: var(--paper);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(8px);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .choice-button:hover {
      transform: translateY(-2px);
      border-color: rgba(216, 169, 71, 0.72);
      background: rgba(89, 69, 36, 0.62);
    }

    .skip-button {
      position: absolute;
      right: 24px;
      top: 20px;
      z-index: 3;
    }

    .skip-button.is-hidden {
      display: none;
    }

    .story-screen {
      align-items: stretch;
      justify-content: stretch;
      background:
        linear-gradient(90deg, rgba(7, 8, 8, 0.96), rgba(7, 8, 8, 0.58), rgba(7, 8, 8, 0.9)),
        url("bg-neighbor.jpeg") center / cover no-repeat;
    }

    .story-panel {
      position: relative;
      z-index: 1;
      width: min(980px, calc(100vw - 36px));
      margin: auto;
      display: grid;
      grid-template-columns: minmax(150px, 260px) 1fr;
      gap: 24px;
      align-items: end;
    }

    .hero-portrait,
    .dialogue-portrait {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid rgba(244, 234, 210, 0.18);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.44);
      mix-blend-mode: normal;
    }

    .story-text {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px var(--shadow);
    }

    .story-name,
    .speaker {
      margin: 0 0 9px;
      color: var(--gold);
      font-weight: 700;
      font-size: 18px;
    }

    .story-line,
    .dialogue-line {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 26px);
      line-height: 1.78;
    }

    .story-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .play-screen {
      flex-direction: column;
      justify-content: flex-start;
      background: #070808;
    }

    .topbar {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      width: 100%;
      min-height: 0;
      padding: clamp(16px, 2vw, 26px) clamp(18px, 2.2vw, 42px);
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(120px, 1fr);
      gap: 16px;
      align-items: start;
      border-bottom: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.56), rgba(0, 0, 0, 0.22) 58%, transparent);
      box-shadow: none;
      pointer-events: none;
    }

    .center-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: auto;
    }

    .chapter {
      min-width: 0;
      width: min(340px, 34vw);
      padding: 10px 13px;
      border: 1px solid rgba(244, 234, 210, 0.1);
      border-radius: 7px;
      background: rgba(7, 8, 8, 0.34);
      backdrop-filter: blur(3px);
    }

    .chapter strong {
      display: block;
      color: #f5e8cb;
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hud-right {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .collection-hud {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-width: 132px;
      pointer-events: auto;
    }

    .collection-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 112px;
      height: 42px;
      padding: 6px 10px;
      border: 1px solid rgba(244, 234, 210, 0.18);
      border-radius: 7px;
      background: rgba(25, 28, 24, 0.52);
      color: var(--muted);
      font-weight: 700;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(4px);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .collection-chip.is-active {
      color: var(--paper);
      border-color: rgba(216, 169, 71, 0.72);
      background: rgba(89, 69, 36, 0.56);
    }

    .collection-chip.is-bumped {
      transform: translateY(-2px) scale(1.04);
      border-color: rgba(255, 226, 170, 0.9);
    }

    .item-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
    }

    .item-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    .timer {
      position: relative;
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: grid;
      place-items: center;
      color: var(--paper);
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.62);
    }

    .timer svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg {
      fill: rgba(15, 17, 14, 0.84);
      stroke: rgba(244, 234, 210, 0.18);
      stroke-width: 4;
    }

    .timer-progress {
      fill: transparent;
      stroke: var(--gold);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 151;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 220ms ease, stroke 160ms ease;
    }

    .timer.is-warning .timer-progress {
      stroke: #d24a38;
    }

    .timer.is-hit {
      animation: timerHit 360ms ease;
    }

    .timer.is-hit .timer-bg {
      fill: rgba(92, 17, 12, 0.9);
      stroke: rgba(255, 105, 80, 0.7);
    }

    .timer.is-hit .timer-progress {
      stroke: #ff4b36;
    }

    .timer-text {
      position: relative;
      z-index: 1;
      font-size: 14px;
      letter-spacing: 0;
    }

    .settings-button {
      width: 46px;
      height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(244, 234, 210, 0.22);
      border-radius: 50%;
      background: rgba(15, 17, 14, 0.54);
      color: var(--paper);
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .settings-button:hover {
      transform: translateY(-1px);
      border-color: rgba(216, 169, 71, 0.7);
      background: rgba(45, 38, 25, 0.7);
    }

    .settings-button svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
    }

    .settings-panel {
      position: absolute;
      right: clamp(18px, 2.2vw, 42px);
      top: 76px;
      z-index: 12;
      width: 236px;
      padding: 14px;
      border: 1px solid rgba(244, 234, 210, 0.18);
      border-radius: 8px;
      background: rgba(12, 14, 12, 0.86);
      color: var(--paper);
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .settings-panel.is-hidden {
      display: none;
    }

    .settings-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-weight: 700;
      font-size: 16px;
    }

    .setting-row {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .setting-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--gold);
    }

    .danger-button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 142, 110, 0.35);
      border-radius: 6px;
      background: rgba(119, 36, 24, 0.72);
      color: var(--paper);
      cursor: pointer;
    }

    .stage-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      flex: none;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .scene-frame {
      position: relative;
      width: 100vw;
      height: calc(100vw * 9 / 16);
      min-width: calc(100vh * 16 / 9);
      min-height: 100vh;
      max-height: none;
      aspect-ratio: auto;
      background: #000;
      overflow: hidden;
      box-shadow: none;
      border: 0;
    }

    .scene-video {
      position: absolute;
      inset: 0;
      object-fit: cover;
    }

    .scene-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
      background: #0a0908;
    }

    .scene-fallback.is-visible { display: block; }

    .scene-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.05), transparent 44%, rgba(0, 0, 0, 0.28)),
        radial-gradient(circle at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.16) 100%);
    }

    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 18;
      background: #050606;
      opacity: 0;
      pointer-events: none;
      transition: opacity 520ms ease;
    }

    .transition-overlay.is-visible {
      opacity: 1;
    }

    .npc-hit {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 3;
    }

    .npc-hit:focus,
    .hotspot:focus {
      outline: none;
    }

    .npc-hit:focus-visible::before {
      box-shadow: 0 0 0 8px rgba(216, 169, 71, 0.16), 0 0 0 13px rgba(244, 234, 210, 0.16);
    }

    .npc-hit::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(216, 169, 71, 0.72);
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(216, 169, 71, 0.12);
      animation: breathe 1800ms ease-in-out infinite;
    }

    .npc-hit.is-muted::before {
      opacity: 0.18;
      animation: none;
    }

    .npc-hit.is-muted {
      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: crosshair;
      opacity: 0;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(18px, 52%);
      height: min(18px, 52%);
      transform: translate(-50%, -50%) scale(0.72);
      border-radius: 50%;
      background: rgba(244, 234, 210, 0.72);
      box-shadow: 0 0 22px rgba(244, 234, 210, 0.78);
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .hotspot:hover::after,
    .hotspot.is-revealed::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .hotspot.is-found {
      pointer-events: none;
      opacity: 1;
    }

    .hotspot.is-found::after {
      width: 34px;
      height: 34px;
      opacity: 1;
      background: transparent;
      border: 3px solid rgba(211, 45, 32, 0.92);
      box-shadow: 0 0 0 5px rgba(211, 45, 32, 0.18), 0 0 24px rgba(211, 45, 32, 0.46);
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .flying-item {
      position: fixed;
      left: 0;
      top: 0;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }

    .time-pop {
      position: fixed;
      z-index: 21;
      color: #f7ead0;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.72);
      pointer-events: none;
    }

    .time-pop.is-bonus {
      color: #d8f0b0;
    }

    .time-pop.is-penalty {
      color: #ff806f;
    }

    .dialogue-panel {
      position: absolute;
      left: clamp(12px, 2vw, 26px);
      right: clamp(12px, 2vw, 26px);
      bottom: clamp(12px, 2vw, 26px);
      z-index: 6;
      min-height: 132px;
      display: grid;
      grid-template-columns: 106px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.56);
    }

    .dialogue-panel.is-hidden {
      display: none;
    }

    .dialogue-portrait {
      height: 106px;
      border-radius: 6px;
    }

    .dialogue-copy {
      min-width: 0;
    }

    .speaker {
      font-size: 16px;
    }

    .dialogue-line {
      font-size: clamp(16px, 1.7vw, 22px);
      line-height: 1.62;
    }

    .dialogue-action {
      min-width: 110px;
      align-self: end;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 94px;
      z-index: 10;
      max-width: min(560px, calc(100vw - 36px));
      padding: 10px 14px;
      border: 1px solid rgba(216, 169, 71, 0.36);
      border-radius: 6px;
      background: rgba(10, 11, 10, 0.92);
      color: var(--paper);
      transform: translate(-50%, -10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      text-align: center;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.42);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .ending-screen {
      background:
        linear-gradient(90deg, rgba(7, 8, 8, 0.94), rgba(7, 8, 8, 0.5), rgba(7, 8, 8, 0.92)),
        url("bg-church.jpeg") center / cover no-repeat;
    }

    .ending-panel {
      position: relative;
      z-index: 1;
      width: min(880px, calc(100vw - 36px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.56);
    }

    .ending-panel h2 {
      margin: 0 0 14px;
      font-size: clamp(30px, 4vw, 52px);
      letter-spacing: 0;
    }

    .clue-list {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      padding: 0;
      list-style: none;
    }

    .clue-list li {
      padding: 12px 14px;
      border-left: 3px solid var(--gold);
      background: rgba(244, 234, 210, 0.08);
      line-height: 1.62;
    }

    .ending-line {
      margin: 0 0 20px;
      color: #e4d7ba;
      font-size: 19px;
      line-height: 1.8;
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }
    }

    @keyframes timerHit {
      0% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-5px) scale(1.1); }
      40% { transform: translateX(5px) scale(1.12); }
      60% { transform: translateX(-3px) scale(1.08); }
      80% { transform: translateX(3px) scale(1.04); }
      100% { transform: translateX(0) scale(1); }
    }

    @media (max-width: 760px) {
      .app {
        min-height: 100vh;
      }

      .start-card {
        margin: 0;
        padding: 24px;
      }

      .story-panel {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .hero-portrait {
        width: min(180px, 42vw);
        justify-self: start;
      }

      .story-text {
        padding: 20px;
      }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        min-height: auto;
        padding: 12px;
      }

      .center-hud {
        gap: 6px;
      }

      .collection-hud {
        min-width: 0;
        width: auto;
        justify-content: center;
        overflow-x: auto;
        padding-bottom: 2px;

    function resolveAsset(source) {
      if (!source || /^(data:|blob:|https?:|file:)/.test(source)) {
        return source;
      }
      if (!GAME_CONFIG.assets.useEmbedded) {
        return source;
      }
      if (embeddedAssetUrls.has(source)) {
        return embeddedAssetUrls.get(source);
      }
      const assetNode = Array.from(document.querySelectorAll("script[data-asset]"))
        .find((node) => node.dataset.asset === source);
      if (!assetNode) {
        return GAME_CONFIG.assets.fallbackToFiles ? source : "";
      }
      const base64 = assetNode.textContent.replace(/\s+/g, "");
      const mime = assetNode.dataset.mime || "application/octet-stream";
      const bytes = [];
      const chunkSize = 32768;
      for (let index = 0; index < base64.length; index += chunkSize) {
        const chunk = atob(base64.slice(index, index + chunkSize));
        const buffer = new Uint8Array(chunk.length);
        for (let i = 0; i < chunk.length; i += 1) {
          buffer[i] = chunk.charCodeAt(i);
        }
        bytes.push(buffer);
      }
      const url = URL.createObjectURL(new Blob(bytes, { type: mime }));
      embeddedAssetUrls.set(source, url);
      return url;
    }

    function setAssetSource(element, source) {
      if (element.dataset.assetSource === source) {

      }
      element.src = resolveAsset(source);
      element.dataset.assetSource = source;

    }

    function updateAudioVolume() {
      const percent = Number(volumeSlider.value);
      state.masterVolume = percent / 100;
      volumeValue.textContent = `${percent}%`;
      bgMusic.volume = GAME_CONFIG.audio.musicVolume * state.masterVolume;
    }

    function playTone({ frequency, duration, type = "sine", volume = 1, slideTo = null }) {
      initAudio();
      const ctx = state.audioContext;
      if (!ctx) {
        return;
      }
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, GAME_CONFIG.audio.sfxVolume * state.masterVolume * volume), now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playSfx(type) {
      if (type === "collect") {
        playTone({ frequency: 660, duration: 0.09, type: "triangle", volume: 0.55, slideTo: 990 });
        setTimeout(() => playTone({ frequency: 990, duration: 0.08, type: "sine", volume: 0.36, slideTo: 1320 }), 45);
        return;
      }
      if (type === "miss") {
        playTone({ frequency: 180, duration: 0.16, type: "sawtooth", volume: 0.45, slideTo: 90 });
        return;
      }
      if (type === "dialogue") {
        playTone({ frequency: 360, duration: 0.055, type: "square", volume: 0.18, slideTo: 460 });
      }
    }

    function fadeMusicTo(targetVolume, duration = GAME_CONFIG.audio.musicFadeMs, pauseWhenSilent = false) {
      cancelAnimationFrame(state.musicFadeId);
      const startVolume = bgMusic.volume;
      const startTime = performance.now();
      const tick = (time) => {
        const progress = Math.min(1, (time - startTime) / duration);
        const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        bgMusic.volume = startVolume + (targetVolume - startVolume) * eased;
        if (progress < 1) {
          state.musicFadeId = requestAnimationFrame(tick);
        } else if (pauseWhenSilent) {
          bgMusic.pause();
          bgMusic.volume = 0;
        }
      };
      state.musicFadeId = requestAnimationFrame(tick);
    }

    function startSceneMusic() {
      initAudio();
      ensureMusicSource();
      cancelAnimationFrame(state.musicFadeId);
      const targetVolume = GAME_CONFIG.audio.musicVolume * state.masterVolume;
      if (bgMusic.paused) {
        bgMusic.volume = 0;
        bgMusic.currentTime = 0;
        bgMusic.play().then(() => fadeMusicTo(targetVolume)).catch(() => {});
      } else {
        fadeMusicTo(targetVolume);
      }
    }

    function stopSceneMusic() {
      fadeMusicTo(0, GAME_CONFIG.audio.musicFadeMs, true);
    }

    function pulseTimerHit() {
      timer.classList.remove("is-hit");
      void timer.offsetWidth;
      timer.classList.add("is-hit");
      setTimeout(() => timer.classList.remove("is-hit"), 380);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function transitionToScene(index) {
      if (state.transitioning) {
        return;
      }
      state.transitioning = true;
      transitionOverlay.classList.add("is-visible");
      await wait(GAME_CONFIG.transition.fadeMs);
      loadScene(index);
      await wait(GAME_CONFIG.transition.holdMs);
      transitionOverlay.classList.remove("is-visible");
      await wait(GAME_CONFIG.transition.fadeMs);
      state.transitioning = false;
    }

    function renderCollectionHud() {
      collectionHud.innerHTML = "";
      const scene = scenes[state.sceneIndex];
      const chip = document.createElement("div");
      chip.className = "collection-chip is-active";
      chip.dataset.scene = String(state.sceneIndex);
      chip.innerHTML = `
        <span class="item-icon">${getItemIcon(scene.itemType)}</span>
        <span>${state.foundByScene[state.sceneIndex].length} / ${scene.hotspots.length}</span>
      `;
      collectionHud.appendChild(chip);
    }

    function pulseCollectionChip(index) {
      const chip = collectionHud.querySelector(`[data-scene="${index}"]`);
      if (!chip) {
        return;
      }
      chip.classList.add("is-bumped");
      setTimeout(() => chip.classList.remove("is-bumped"), 260);
    }

    function getActiveCollectionIconRect() {
      const chip = collectionHud.querySelector(`[data-scene="${state.sceneIndex}"] .item-icon`);
      return chip ? chip.getBoundingClientRect() : collectionHud.getBoundingClientRect();
    }

    function updateTimer() {
      const safeTime = Math.max(0, state.timeRemaining);
      const minutes = Math.floor(safeTime / 60);
      const seconds = safeTime % 60;
      timerText.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
      const progress = Math.max(0, Math.min(1, safeTime / TIMER_START));
      timerProgress.style.strokeDashoffset = String(TIMER_RING * (1 - progress));
      timer.classList.toggle("is-warning", safeTime <= 10 && state.mode === "search");
    }

    function clearGameTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function resetGameTimer() {
      clearGameTimer();
      state.timeRemaining = TIMER_START;
      state.combo = 0;
      updateTimer();
    }

    function startGameTimer() {
      clearGameTimer();
      state.timeRemaining = TIMER_START;
      state.combo = 0;
      updateTimer();
      state.timerId = setInterval(() => {
        if (state.mode !== "search") {
          return;
        }
        state.timeRemaining -= 1;
        updateTimer();
        if (state.timeRemaining <= 0) {
          failScene();
        }
      }, 1000);
    }

    function changeTime(delta) {
      state.timeRemaining = Math.max(0, state.timeRemaining + delta);
      if (delta < 0) {
        pulseTimerHit();
      }
      updateTimer();
      showTimePop(delta);
      if (state.timeRemaining <= 0) {
        failScene();
      }
    }

    function showTimePop(delta) {
      const rect = timer.getBoundingClientRect();
      const pop = document.createElement("div");
      pop.className = `time-pop ${delta > 0 ? "is-bonus" : "is-penalty"}`;
      pop.textContent = `${delta > 0 ? "+" : ""}${delta}s`;
      pop.style.left = `${rect.left + rect.width / 2}px`;
      pop.style.top = `${rect.top + rect.height / 2}px`;
      fxLayer.appendChild(pop);
      pop.animate([
        { opacity: 0, transform: "translate(-50%, -10%) scale(.9)" },
        { opacity: 1, transform: "translate(-50%, -70%) scale(1)" },
        { opacity: 0, transform: "translate(-50%, -150%) scale(.96)" }
      ], { duration: 820, easing: "ease-out" }).addEventListener("finish", () => pop.remove());
    }

    function animateCollectToHud(scene, sourceNode, event) {
      const sourceRect = sourceNode.getBoundingClientRect();
      const targetRect = getActiveCollectionIconRect();
      const startX = event ? event.clientX : sourceRect.left + sourceRect.width / 2;
      const startY = event ? event.clientY : sourceRect.top + sourceRect.height / 2;
      const endX = targetRect.left + targetRect.width / 2;
      const endY = targetRect.top + targetRect.height / 2;
      const item = document.createElement("div");
      item.className = "flying-item";
      item.innerHTML = `<span class="item-icon">${getItemIcon(scene.itemType)}</span>`;
      item.style.left = `${startX}px`;
      item.style.top = `${startY}px`;
      fxLayer.appendChild(item);
      const dx = endX - startX;
      const dy = endY - startY;
      const midDx = dx * 0.36;
      const midY = Math.min(startY, endY) - 90;
      item.animate([
        { transform: "translate(-50%, -50%) scale(.72)", opacity: 0 },
        { transform: `translate(-50%, -50%) translate(${midDx}px, ${midY - startY}px) scale(1.08)`, opacity: 1, offset: 0.48 },
        { transform: `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(.45)`, opacity: 0.1 }
      ], { duration: 680, easing: "cubic-bezier(.22,.78,.22,1)" }).addEventListener("finish", () => {
        item.remove();
        pulseCollectionChip(state.sceneIndex);
      });
    }

    function setChoiceOptions(options) {
      choiceOptions.innerHTML = "";
      skipOpeningButton.classList.add("is-hidden");
      options.forEach((option) => {
        const button = document.createElement("button");
        button.className = "choice-button";
        button.type = "button";
        button.textContent = option.label;
        button.addEventListener("click", () => {
          playSfx("dialogue");
          choiceOptions.classList.add("is-hidden");
          if (option.action === "playStory") {
            playOpeningVideo(GAME_CONFIG.openingFlow.story.video, "story");
            return;
          }
          if (option.video) {
            playOpeningVideo(option.video, "reaction");
          }
        });
        choiceOptions.appendChild(button);
      });
      choiceOptions.classList.remove("is-hidden");
    }

    function playOpeningVideo(src, phase) {
      state.openingPhase = phase;
      choiceOptions.classList.add("is-hidden");
      skipOpeningButton.classList.remove("is-hidden");
      introVideo.removeAttribute("controls");
      setAssetSource(introVideo, src);
      introVideo.currentTime = 0;
      const playPromise = introVideo.play();
      if (playPromise) {
        playPromise.catch(() => {
          showToast("视频需要手动播放。");
          introVideo.setAttribute("controls", "controls");
        });
      }
    }

    function startIntro() {
      initAudio();
      showScreen("intro");
      playOpeningVideo(GAME_CONFIG.openingFlow.first.video, "first");
    }

    async function enterPlayFromOpening() {
      introVideo.pause();
      choiceOptions.classList.add("is-hidden");
      skipOpeningButton.classList.add("is-hidden");
      transitionOverlay.classList.add("is-visible");
      await wait(GAME_CONFIG.transition.fadeMs);
      loadScene(0);
      showScreen("play");
      await wait(GAME_CONFIG.transition.holdMs);
      transitionOverlay.classList.remove("is-visible");
    }

    function handleOpeningVideoEnded() {
      skipOpeningButton.classList.add("is-hidden");
      if (state.openingPhase === "first") {
        setChoiceOptions(GAME_CONFIG.openingFlow.first.options);
        return;
      }
      if (state.openingPhase === "story") {
        setChoiceOptions(GAME_CONFIG.openingFlow.story.options);
        return;
      }
      if (state.openingPhase === "reaction") {
        playOpeningVideo(GAME_CONFIG.openingFlow.final, "final");
        return;
      }
      if (state.openingPhase === "final") {
        enterPlayFromOpening();
      }
    }

    function skipOpeningVideoSegment() {
      if (!screens.intro.classList.contains("is-active") || skipOpeningButton.classList.contains("is-hidden")) {
        return;
      }
      playSfx("dialogue");
      introVideo.pause();
      if (Number.isFinite(introVideo.duration)) {
        introVideo.currentTime = Math.max(0, introVideo.duration - 0.08);
      }
      handleOpeningVideoEnded();
    }

    function continueStory() {
      loadScene(0);
      showScreen("play");
    }

    function loadScene(index) {
      const scene = scenes[index];
      state.sceneIndex = index;
      state.dialogueIndex = 0;
      state.mode = state.completedScenes.has(index) ? "complete" : "dialogue";
      state.found = state.foundByScene[index];
      resetGameTimer();
      setAssetSource(sceneFallback, scene.fallback);
      sceneFallback.alt = `${scene.title}静态场景`;
      sceneFallback.classList.add("is-visible");
      setAssetSource(sceneVideo, scene.video);
      const showFallback = () => sceneFallback.classList.add("is-visible");
      const showVideo = () => sceneFallback.classList.remove("is-visible");
      sceneVideo.addEventListener("loadeddata", showVideo, { once: true });
      sceneVideo.addEventListener("playing", showVideo, { once: true });
      sceneVideo.addEventListener("error", showFallback, { once: true });
      const playPromise = sceneVideo.play();
      if (playPromise) playPromise.catch(showFallback);
      sceneTitle.textContent = scene.title;
      sceneObjective.textContent = scene.objectiveIdle;
      setAssetSource(dialoguePortrait, scene.portrait);
      dialoguePortrait.alt = scene.speaker;
      speaker.textContent = scene.speaker;
      dialoguePanel.classList.add("is-hidden");
      updateNpc();
      renderHotspots();
      updateCounter();
      updateTabs();
      renderCollectionHud();
    }

    function updateNpc() {
      const scene = scenes[state.sceneIndex];
      Object.assign(npcButton.style, {
        left: `${scene.npc.x * 100}%`,
        top: `${scene.npc.y * 100}%`,
        width: `${scene.npc.w * 100}%`,
        height: `${scene.npc.h * 100}%`
      });
      npcButton.classList.toggle("is-muted", state.mode !== "dialogue");
      npcButton.disabled = state.mode !== "dialogue";
    }

    function renderHotspots() {
      const scene = scenes[state.sceneIndex];
      hotspotLayer.innerHTML = "";
      scene.hotspots.forEach((spot, index) => {
        const pad = GAME_CONFIG.hotspotPadding;
        const x = Math.max(0, spot.x - pad);
        const y = Math.max(0, spot.y - pad);
        const w = Math.min(1 - x, spot.w + pad * 2);
        const h = Math.min(1 - y, spot.h + pad * 2);
        const button = document.createElement("button");
        button.className = "hotspot";
        button.type = "button";
        button.setAttribute("aria-label", `${scene.itemName}${index + 1}`);
        Object.assign(button.style, {
          left: `${x * 100}%`,
          top: `${y * 100}%`,
          width: `${w * 100}%`,
          height: `${h * 100}%`
        });
        if (state.found.includes(index)) {
          button.classList.add("is-found");
        }
        button.addEventListener("click", (event) => collectItem(index, button, event));
        hotspotLayer.appendChild(button);
      });
      setHotspotEnabled(state.mode === "search");
    }

    function setHotspotEnabled(enabled) {
      Array.from(hotspotLayer.children).forEach((node) => {
        node.disabled = !enabled;
        node.style.pointerEvents = enabled ? "auto" : "none";
      });
    }

    function advanceDialogue() {
      const scene = scenes[state.sceneIndex];
      if (state.mode !== "dialogue") {
        return;
      }

      if (state.dialogueIndex < scene.dialogues.length) {
        playSfx("dialogue");
        speaker.textContent = scene.speaker;
        dialogueLine.textContent = scene.dialogues[state.dialogueIndex];
        dialogueButton.textContent = state.dialogueIndex === scene.dialogues.length - 1 ? "开始寻找" : "继续";
        dialoguePanel.classList.remove("is-hidden");
        state.dialogueIndex += 1;
        return;
      }

      beginSearch();
    }

    function beginSearch() {
      const scene = scenes[state.sceneIndex];
      state.mode = "search";
      state.found = state.foundByScene[state.sceneIndex];
      dialoguePanel.classList.add("is-hidden");
      sceneObjective.textContent = scene.objectiveFind;
      setHotspotEnabled(true);
      updateNpc();
      updateTabs();
      startSceneMusic();
      startGameTimer();
      showToast(`找到 10 个${scene.itemName}后再回来交换线索。`);
    }

    function collectItem(index, node, event) {
      if (event) {
        event.stopPropagation();
      }
      if (state.mode !== "search" || state.found.includes(index)) {
        return;
      }
      const scene = scenes[state.sceneIndex];
      state.found.push(index);
      node.classList.add("is-found");
      playSfx("collect");
      animateCollectToHud(scene, node, event);
      updateCounter();
      state.combo += 1;
      if (state.combo >= GAME_CONFIG.timer.comboNeed) {
        state.combo = 0;
        changeTime(GAME_CONFIG.timer.comboBonusSeconds);
        showToast(`连续找到 ${GAME_CONFIG.timer.comboNeed} 个，时间 +${GAME_CONFIG.timer.comboBonusSeconds} 秒。`);
      }

      if (state.found.length === scene.hotspots.length) {
        completeScene();
      }
    }

    function completeScene() {
      const scene = scenes[state.sceneIndex];
      state.mode = "complete";
      clearGameTimer();
      stopSceneMusic();
      state.completedScenes.add(state.sceneIndex);
      state.clues[state.sceneIndex] = scene.clue;
      setHotspotEnabled(false);
      updateNpc();
      updateTabs();
      sceneObjective.textContent = `已找齐 ${scene.hotspots.length} 个${scene.itemName}。`;
      speaker.textContent = scene.speaker;
      dialogueLine.textContent = scene.clue;
      dialogueButton.textContent = state.sceneIndex < scenes.length - 1 ? `进入${scenes[state.sceneIndex + 1].shortName}` : "播放真相";
      dialoguePanel.classList.remove("is-hidden");
    }

    function failScene() {
      if (state.mode !== "search") {
        return;
      }
      const scene = scenes[state.sceneIndex];
      state.mode = "failed";
      clearGameTimer();
      playSfx("miss");
      stopSceneMusic();
      state.combo = 0;
      state.foundByScene[state.sceneIndex] = [];
      state.found = state.foundByScene[state.sceneIndex];
      setHotspotEnabled(false);
      renderHotspots();
      updateCounter();
      updateNpc();
      updateTabs();
      sceneObjective.textContent = `时间耗尽，重新找齐 10 个${scene.itemName}。`;
      speaker.textContent = "艾米";
      dialogueLine.textContent = "风雪把线索掩得太快了。再试一次，这次不能浪费任何一步。";
      dialogueButton.textContent = "重新挑战";
      dialoguePanel.classList.remove("is-hidden");
    }

    function retrySceneSearch() {
      state.foundByScene[state.sceneIndex] = [];
      state.found = state.foundByScene[state.sceneIndex];
      renderHotspots();
      updateCounter();
      beginSearch();
    }

    function proceedAfterComplete() {
      if (state.sceneIndex < scenes.length - 1) {
        transitionToScene(state.sceneIndex + 1);
        return;
      }
      startTruthVideo();
    }

    async function startTruthVideo() {
      clearGameTimer();
      stopSceneMusic();
      renderEnding();
      transitionOverlay.classList.add("is-visible");
      await wait(GAME_CONFIG.transition.fadeMs);
      showScreen("truth");
      setAssetSource(truthVideo, GAME_CONFIG.media.truthVideo);
      truthVideo.currentTime = 0;
      const playPromise = truthVideo.play();
      if (playPromise) {
        playPromise.catch(() => {
          showToast("结尾视频需要手动播放。");
          truthVideo.setAttribute("controls", "controls");
        });
      }
      await wait(GAME_CONFIG.transition.holdMs);
      transitionOverlay.classList.remove("is-visible");
    }

    function finishTruthVideo() {
      truthVideo.pause();
      truthVideo.removeAttribute("controls");
      showScreen("ending");
    }

    function updateCounter() {
      renderCollectionHud();
    }

    function updateTabs() {
      // 场景按剧情自动推进，这里保留空函数避免分支里重复判断。
    }

    function renderEnding() {
      clueList.innerHTML = "";
      state.clues.forEach((clue, index) => {
        const item = document.createElement("li");
        item.textContent = `${scenes[index].shortName}：${clue}`;
        clueList.appendChild(item);
      });
    }

    function restartGame() {
      clearGameTimer();
      stopSceneMusic();
      introVideo.pause();
      truthVideo.pause();
      settingsPanel.classList.add("is-hidden");
      choiceOptions.classList.add("is-hidden");
      skipOpeningButton.classList.add("is-hidden");
      state.storyIndex = 0;
      state.sceneIndex = 0;
      state.dialogueIndex = 0;
      state.mode = "dialogue";
      state.openingPhase = "";
      state.found = [];
      state.foundByScene = scenes.map(() => []);
      state.completedScenes = new Set();
      state.clues = [];
      state.combo = 0;
      resetGameTimer();
      renderCollectionHud();
      showScreen("start");
    }

    document.getElementById("startButton").addEventListener("click", startIntro);
    document.getElementById("skipTruthButton").addEventListener("click", finishTruthVideo);
    document.getElementById("restartButton").addEventListener("click", restartGame);
    skipOpeningButton.addEventListener("click", skipOpeningVideoSegment);
    settingsButton.addEventListener("click", () => {
      initAudio();
      settingsPanel.classList.toggle("is-hidden");
    });
    volumeSlider.addEventListener("input", updateAudioVolume);
    endGameButton.addEventListener("click", restartGame);
    storyNextButton.addEventListener("click", continueStory);
    introVideo.addEventListener("ended", handleOpeningVideoEnded);
    introVideo.addEventListener("error", () => {
      showToast("没有读到视频，已进入调查。");
      enterPlayFromOpening();
    });
    truthVideo.addEventListener("ended", finishTruthVideo);
    truthVideo.addEventListener("error", () => {
      showToast("没有读到结尾视频，已显示真相。");
      finishTruthVideo();
    });
    npcButton.addEventListener("click", advanceDialogue);
    dialogueButton.addEventListener("click", () => {
      if (state.mode === "complete") {
        proceedAfterComplete();
      } else if (state.mode === "failed") {
        retrySceneSearch();
      } else {
        advanceDialogue();
      }
    });
    sceneFrame.addEventListener("click", (event) => {
      if (state.mode !== "search") {
        return;
      }
      if (event.target.closest(".hotspot") || event.target.closest(".dialogue-panel")) {
        return;
      }
      state.combo = 0;
      playSfx("miss");
      changeTime(-GAME_CONFIG.timer.missPenaltySeconds);
      showToast(`点错了，时间 -${GAME_CONFIG.timer.missPenaltySeconds} 秒。`);
    });
    document.addEventListener("DOMContentLoaded", initializeConfiguredAssets, { once: true });
    updateAudioVolume();
    resetGameTimer();
    renderCollectionHud();
  </script>

  <script>
    (() => {
      const LEVEL_ID = "potato";
      let completionSent = false;
      let pausedMode = null;
      let pausedMedia = [];
      const hostOrigin = location.origin === "null" ? "*" : location.origin;

      function notify(type, payload = {}) {
        if (window.parent === window) return;
        const bareType = type.startsWith("huazhongren:") ? type.slice("huazhongren:".length) : type;
        window.parent.postMessage({ source: "huazhongren-level", type: `huazhongren:${bareType}`, level: LEVEL_ID, ...payload }, hostOrigin);
      }

      function reportProgress(stage = "scene") {
        const percent = stage === "ending" ? 100 : Math.round(state.completedScenes.size / scenes.length * 100);
        notify("progress", { checkpoint: `potato:${stage}:scene-${state.sceneIndex + 1}`, percent });
      }

      function reportComplete() {
        if (completionSent) return;
        completionSent = true;
        reportProgress("ending");
        notify("level-complete");
      }

      function pauseLevel() {
        if (pausedMode === null) {
          pausedMode = state.mode;
          state.mode = "host-paused";
        }
        pausedMedia = [...document.querySelectorAll("audio, video")].filter(media => !media.paused);
        pausedMedia.forEach(media => media.pause());
        if (state.audioContext?.state === "running") state.audioContext.suspend();
      }

      function resumeLevel() {
        if (pausedMode !== null) {
          state.mode = pausedMode;
          pausedMode = null;
        }
        pausedMedia.forEach(media => media.play().catch(() => {}));
        pausedMedia = [];
        if (state.audioContext?.state === "suspended") state.audioContext.resume().catch(() => {});
      }

      if (window.parent === window) {
        const returnButton = document.createElement("button");
        returnButton.id = "level-return-global";
        returnButton.type = "button";
        returnButton.textContent = "返回画廊（本关将从头开始）";
        returnButton.style.cssText = "position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));min-width:44px;min-height:48px;padding:9px 14px;color:#f3e8ca;background:#16110d;border:1px solid #c59c4f;box-shadow:0 5px 20px #000b;cursor:pointer;font:16px 'Microsoft YaHei',sans-serif";
        returnButton.addEventListener("click", () => location.assign("../../index.html"));
        document.body.append(returnButton);
      }

      new MutationObserver(() => {
        if (screens.ending.classList.contains("is-active")) reportComplete();
      }).observe(screens.ending, { attributes: true, attributeFilter: ["class"] });
      truthVideo.addEventListener("ended", reportComplete);

      window.addEventListener("message", event => {
        if (event.origin !== location.origin || event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.source !== "huazhongren-gallery" || message.level !== LEVEL_ID) return;
        const messageType = String(message.type || "").startsWith("huazhongren:") ? String(message.type).slice("huazhongren:".length) : message.type;
        if (messageType === "pause") pauseLevel();
        if (messageType === "resume") resumeLevel();
        if (messageType === "restart") restartGame();
        if (messageType === "settings") {
          const value = Math.round((message.volume ?? message.settings?.volume ?? .8) * 100);
          volumeSlider.value = String(value);
          updateAudioVolume();
        }
      });

      notify("ready");
      reportProgress("ready");
      document.addEventListener("click", () => setTimeout(() => reportProgress("interaction"), 0));
    })();
  </script>
</body>
</html>
